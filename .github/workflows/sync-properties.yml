name: Sincroniza imóveis da 7Cantos

# Duas vezes por dia, em horários fora do :00 para não concorrer com o pico de
# agendamentos do GitHub Actions. 09:17 e 21:17 UTC = 06:17 e 18:17 em Brasília.
on:
  schedule:
    - cron: "17 9,21 * * *"
  workflow_dispatch:

# Evita que duas execuções commitem o mesmo arquivo ao mesmo tempo.
concurrency:
  group: sync-properties-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          # O script importa módulos .ts direto, o que depende do type-stripping
          # nativo do Node (22.18+).
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sincroniza imóveis
        env:
          SETE_CANTOS_API_TOKEN: ${{ secrets.SETE_CANTOS_API_TOKEN }}
        run: npm run sync:properties -- --campanhas

      - name: Commita se houve mudança
        run: |
          if git diff --quiet -- data/properties.json; then
            echo "Nenhuma mudança nos imóveis."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/properties.json
          git commit -m "chore: atualiza imóveis da Vila Clementino via API"
          git push
